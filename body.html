<!DOCTYPE html>
<html>
<head>
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<script>
function fillCredits() {
    let values = [22,22,23,22,22,22,25,21];
    let inputs = document.getElementsByName("credit");

    for (let i = 0; i < inputs.length; i++) {
        inputs[i].value = values[i];
    }
}
</script>
<body>

<div class="container">
    <h1>🎓 CGPA Calculator</h1>

    <form method="POST">

    <div class="grid">

        {% for i in range(8) %}
        <div class="card">
            <p>Sem {{ i+1 }}</p>

            <input type="number" step="any" name="sgpa" placeholder="SGPA">
            <input type="number" step="any" name="credit" placeholder="Credits">
        </div>
        {% endfor %}

    </div>
    <button type="button" onclick="fillCredits()">Use IGDTUW Credits</button>

    <button type="submit">Calculate</button>
    <button type="button" onclick="fillCredits()">Auto Credits</button>

</form>

    {% if cgpa %}
        <p class="result">Your CGPA: {{ cgpa }}</p>
    {% endif %}
</div>

</body>
</html>
