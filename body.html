<!DOCTYPE html>
<html>
<head>
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="{{ url_for('style') }}">
</head>
<body>

<div class="container">
    <h1>🎓 CGPA Calculator</h1>

    <form method="POST">
        <input type="number" step="any" name="sgpa" placeholder="Sem 1 SGPA">
        <input type="number" step="any" name="sgpa" placeholder="Sem 2 SGPA">
        <input type="number" step="any" name="sgpa" placeholder="Sem 3 SGPA">
        <input type="number" step="any" name="sgpa" placeholder="Sem 4 SGPA">
        <input type="number" step="any" name="sgpa" placeholder="Sem 5 SGPA">
        <input type="number" step="any" name="sgpa" placeholder="Sem 6 SGPA">
        <input type="number" step="any" name="sgpa" placeholder="Sem 7 SGPA">
        <input type="number" step="any" name="sgpa" placeholder="Sem 8 SGPA">


        <button type="submit">Calculate</button>
    </form>

    {% if cgpa %}
        <p class="result">Your CGPA: {{ cgpa }}</p>
    {% endif %}
</div>

</body>
</html>
